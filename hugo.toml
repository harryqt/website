baseurl = "https://harry.plus"
title = "HARRY"
languagecode = "en"
defaultcontentlanguage = "en"

[pagination]
  pagerSize = 20

[markup.highlight]
  style = "github-dark"

[params]
  author = "Harry"
  info = "Programmer 👨🏻‍💻"
  description = "Harry's personal website"
  keywords = "blog,developer,personal"
  avatarurl = "images/me-1.jpg"

  faviconSVG = "/images/favicon.svg"
  favicon_32 = "/images/favicon-32x32.png"
  favicon_16 = "/images/favicon-16x16.png"

  enableTwemoji = true

  colorScheme = "auto"
  hidecolorschemetoggle = false

  customCSS = ["css/custom.css"]
  # customSCSS = ["scss/custom.scss"]
  # customJS = ["js/custom.js"]

[taxonomies]
  category = "categories"
  series = "series"
  tag = "tags"
  author = "authors"

# Social links
[[params.social]]
  name = "Github"
  icon = "fa-brands fa-github fa-2x"
  weight = 1
  url = "https://github.com/harryqt"
[[params.social]]
  name = "Twitter"
  icon = "fa-brands fa-x-twitter fa-2x"
  weight = 2
  url = "https://x.com/iarijitbiswas"
[[params.social]]
  name = "Reddit"
  icon = "fa-brands fa-reddit fa-2x"
  weight = 3
  url = "https://www.reddit.com/user/Dibbyo123"

# Menu links
[[menu.main]]
  name = "Blog"
  weight = 1
  url  = "posts/"
[[menu.main]]
  name = "About"
  weight = 2
  url = "about/"

